name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs-on: windows-latest
          - platform: linux
            # Pinned: `ubuntu-latest` migrates to Ubuntu 26 in Oct 2026, and the
            # GTK 3 / WebKitGTK 4.1 build deps are validated on 24.04.
            runs-on: ubuntu-24.04
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.x

      # Electrobun's Linux launcher links GTK 3 and WebKitGTK 4.1.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # package.json and electrobun.config.ts must agree even on branch builds.
      - name: Check release versions
        run: bun run release:check

      - name: Full check
        run: bun run check

      # Catch packaging breakage before a release tag is pushed.
      - name: Build desktop app
        run: bun run desktop:build
